name: Periodic Health Check

on:
  # Manual Trigger: trigger the check from the GitHub Actions tab without waiting for the scheduled timer.
  workflow_dispatch:
  schedule:
    # Scheduled timer: Runs every 15 minutes during testing.
    - cron: "*/15 * * * *"

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v6
        with:
          # Send an HTTP GET request (ping) to our deployed server endpoint.
          url: https://fullstackopen-part-11.onrender.com/health
          # Optional: retry up to 3 times (with 5 sec between tries), before declaring a failure.
          max-attempts: 3
          retry-delay: 5s
