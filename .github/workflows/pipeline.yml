# FullStackOpen-Part-11/.github/workflows/pipeline.yml:
name: Deployment pipeline
# When will this workflow be triggered?
on:
  # Trigger workflow on pushes directly to main branch.
  push:
    branches:
      - main
  # Trigger workflow on pull requests targeting the main branch
  pull_request:
    branches: [main]
    types: [opened, synchronize] # Runs when a PR is opened or updated with new commits.

# Set default execution directory globally, for run steps across all jobs.
defaults:
  run:
    working-directory: ./pokedex-app

jobs:
  # Job-1: Build & Test: Responsible for code validation, unit tests, building, and E2E testing.
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      # Step-1: Check out the repository code into the runner environment.
      - uses: actions/checkout@v6
      # Step-2: Set up Node.js runtime environment (v24).
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # Step-3: Install all project dependencies (dependencies and devDependencies).
      - name: Install dependencies
        run: npm install
      # Step-4: Run ESLint to verifing code quality and style standards.
      - name: Check style
        run: npm run eslint
      # Step-5: Run unit/integration tests with Jest.
      - name: Test
        run: npm test
      # Step-6: Create the production bundle with Webpack.
      - name: Build
        run: npm run build
      # Step-7: Print current execution date for debugging/logging.
      - name: Run date
        run: |
          date
      # Step-8: List directory contents to inspect the build state.
      - name: Run ls -l
        run: ls -l
      # Step-9: Download Playwright browser binaries (Chromium) and system dependencies required for CI.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # Step-10: Execute Playwright E2E tests (automatically starts Webpack server and tests the site).
      - name: Run Playwright tests
        run: npm run test:e2e

  # Job-2: Deploy: Execute if 'build_and_test' succeeds AND the commit is not skipped.
  deploy:
    needs: build_and_test
    # Conditional guard statement: Skip deployment if triggered by PR OR if any commit message in the push event contains '#skip'
    if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }} # See Note on Step-11
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clones the repository so the working directory exists
      - uses: actions/checkout@v6
      # Step-2: Trigger deployment on Render using the deploy hook via curl command
      - name: Trigger deployment on Render
        # Send HTTP GET request to Render's deploy hook URL using curl. Thus informing Render that the pipeline passed and a new deployment can start.
        run: curl -sS -f ${{ secrets.RENDER_DEPLOY_HOOK }}

  # Job-3: Notify Success: Run in parallel with 'tag_release' if 'Deploy' succeeds.
  notify_success:
    # Trigger only on if deploy succeeds.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Step-1: Discord Success Notification. Send notification if deployment completes successfully.
      - name: Discord Success Notification
        # Updated to sarisia/actions-status-discord@v1 (valid action slug)
        uses: sarisia/actions-status-discord@v1
        with:
          # Changed 'webhook-url' to 'webhook' (expected parameter name for sarisia)
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          # Set the status color band on the left of the Discord card (success = green).
          status: success
          # Main header text rendered at the top of the Discord embed card.
          title: "Deployment Successful! A new version deployed to production"
          # # Multi-line string (denoted by '|') formatted with Markdown to display debug context.
          description: |
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}

  # Job-3 Tag Release: Run in parallel with 'notify_success' after 'deploy' succeeds.
  tag_release:
    # Trigger only on if deploy succeeds.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Step-1: Checkout repository history.
      - uses: actions/checkout@v6
        with:
          # fetch-depth: '0': fetches entire git commit history and all existing tags. Required so tag action can calculate the previous tag version.
          fetch-depth: "0"
      # Step-2: Calculate and push the new version tag.
      - name: Bump version and push tag
        # Conditional guard statement: Ensures tagging only happens on direct pushes/merges to main.
        if: ${{ github.event_name == 'push' }}
        uses: anothrNick/github-tag-action@1.75.0
        env:
          # Passes the GitHub authentication token required to create and push tags back to the repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Overrides the action's default 'minor' increment to increment the patch instead.
          DEFAULT_BUMP: patch
          # DRY_RUN: Test logic on GitHub without creating a tag on the repository. Declare false for production.
          DRY_RUN: false

  # Job-3: Notify Failure: Monitor previous jobs and runs if any preceding step/job fails.
  notify_failure:
    # Trigger only afer build-test and deploy complete.
    needs: [build_and_test, deploy]
    # failure() evaluates to true if either build_and_test or deploy fails
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      # Step-1: Discord Failure Notification. Send verbose notification if any step in the job fails.
      - name: Discord Failure Notification
        # Specify third-party action to execute for building and sending the Discord message payload.
        uses: sarisia/actions-status-discord@v1
        with:
          # Reads the Discord webhook URL stored securely in your repository's GitHub Actions Secrets.
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          # Set the status color band on the left of the Discord card (failure = red).
          status: failure
          # Main header text rendered at the top of the Discord embed card.
          title: "Build Failed! The pipeline encountered an error"
          # Verbose output to pinpoint the offending commit and runner logs quickly
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}
            **Workflow:** ${{ github.workflow }}
            **Job:** ${{ github.job }}
            [View Commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

#  Note on Job-2: Deploy:
#  github.event.commits.*.message: Extracts an array of all commit message strings in the push event.
#  join(..., ' '): Flatten that array into a single space-separated string.
#  contains(..., '#skip'): Checks if #skip exists anywhere in that combined text.
#  !: Inversion. So, the step executes only when #skip is not found in any of the merged commits.

#  Job-3: Notify Failure:
## #  [View Commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
# Markdown hyperlink format: [Link Text](URL)
# - [View Commit]: The text that appears as a clickable hyperlink in Discord.
# - https://github.com/: Base GitHub web URL.
# - ${{ github.repository }}: Evaluates to "owner/repo-name" (e.g., "username/pokedex-app").
# - /commit/: Path to view individual commit changes.
# - ${{ github.sha }}: Evaluates to the full 40-character commit hash that triggered the workflow.

## #  [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
# Markdown hyperlink format: [Link Text](URL)
# - [View Workflow Run]: The text that appears as a clickable hyperlink in Discord.
# - https://github.com/: Base GitHub web URL.
# - ${{ github.repository }}: Evaluates to "owner/repo-name" (e.g., "username/pokedex-app").
# - /actions/runs/: Path to view GitHub Actions execution logs.
# - ${{ github.run_id }}: Evaluates to the unique numerical ID assigned by GitHub to this specific pipeline execution.
