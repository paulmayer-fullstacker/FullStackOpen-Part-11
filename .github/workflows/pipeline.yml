# FullStackOpen-Part-11/.github/workflows/pipeline.yml:
name: Deployment pipeline

on:
  push:
    branches:
      - main
jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    # Set the working directory for all steps in this job:
    defaults:
      run:
        working-directory: ./pokedex-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Check style
        run: npm run eslint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Run date
        run: |
          date
      - name: Run ls -l
        run: ls -l
