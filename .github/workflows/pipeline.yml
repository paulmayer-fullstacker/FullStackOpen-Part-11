# FullStackOpen-Part-11/.github/workflows/pipeline.yml:
name: Deployment pipeline
# When will this workflow be triggered?
on:
  # Trigger workflow on pushes directly to main branch.
  push:
    branches:
      - main
  # Trigger workflow on pull requests targeting the main branch
  pull_request:
    branches: [main]
    types: [opened, synchronize] # Runs when a PR is opened or updated with new commits.
jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    # Set the working directory for all steps in this job:
    defaults:
      run:
        working-directory: ./pokedex-app
    steps:
      # Step-1: Check out the repository code into the runner environment.
      - uses: actions/checkout@v6
      # Step-2: Set up Node.js runtime environment (v24).
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # Step-3: Install all project dependencies (dependencies and devDependencies).
      - name: Install dependencies
        run: npm install
      # Step-4: Run ESLint to verifing code quality and style standards.
      - name: Check style
        run: npm run eslint
      # Step-5: Run unit/integration tests with Jest.
      - name: Test
        run: npm test
      # Step-6: Create the production bundle with Webpack.
      - name: Build
        run: npm run build
      # Step-7: Download Playwright browser binaries (Chromium) and system dependencies required for CI.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      # Step-8: Execute Playwright E2E tests (automatically starts Webpack server and tests the site).
      - name: Run Playwright tests
        run: npm run test:e2e
      # Step-9: Print current execution date for debugging/logging.
      - name: Run date
        run: |
          date
      # Step-10: List directory contents to inspect the build state.
      - name: Run ls -l
        run: ls -l
      # Step-11: Trigger deployment on Render using the deploy hook
      - name: Trigger deployment
        # Conditional guard statement: Skip deployment if triggered by PR OR if any commit message in the push event contains '#skip'
        if: ${{ github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }} # See Note on Step-11
        # Send HTTP GET request to Render's deploy hook URL using curl. Thus informing Render that the pipeline passed and a new deployment can start.
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
      # Step-12: Send a Discord notification if deployment completes successfully
      - name: Discord Success Notification
        uses: rsaatci/github-action-discord@v1.0.1
        # Triggers ONLY on direct main pushes (deployment) AND when all prior steps succeed.
        if: ${{ success() && github.event_name == 'push' && !contains(join(github.event.commits.*.message, ' '), '#skip') }}
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "Deployment Successful! A new version deployed to production"
          description: |
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}
      # Step-13: Send a verbose Discord notification if ANY step in the job fails
      - name: Discord Failure Notification
        uses: rsaatci/github-action-discord@v1.0.1
        # failure() forces this step to execute even if an earlier step (linting, tests, build) errored out.
        if: ${{ failure() }}
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "Build Failed! The pipeline encountered an error"
          # Verbose output to pinpoint the offending commit and runner logs quickly
          description: |
            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Message:** ${{ github.event.head_commit.message }}
            **Author:** ${{ github.actor }}
            **Workflow:** ${{ github.workflow }}
            **Job:** ${{ github.job }}

            [View Commit](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
  # Jobs run independently of eachother (in parallel). However, t_r is dependent on s_d_p, and can't start until s_d_p has completed.
  tag_release:
    # Explicitly make this job wait until 's_d_p' finishes successfully. If linting/testing/building/deployment fail, t_r will not run.
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    steps:
      # Step-1: Checkout repository history.
      - uses: actions/checkout@v6
        with:
          # fetch-depth: '0': fetches entire git commit history and all existing tags. Required so tag action can calculate the previous tag version.
          fetch-depth: "0"
      # Step-2: Calculate and push the new version tag.
      - name: Bump version and push tag
        # Conditional guard statement: Ensures tagging only happens on direct pushes/merges to main.
        if: ${{ github.event_name == 'push' }}
        uses: anothrNick/github-tag-action@1.75.0
        env:
          # Passes the GitHub authentication token required to create and push tags back to the repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Overrides the action's default 'minor' increment to increment the patch instead.
          DEFAULT_BUMP: patch
          # DRY_RUN: Test logic on GitHub without creating a tag on the repository. Declare false for production.
          DRY_RUN: false

#  Note on Step-11:
#  github.event.commits.*.message: Extracts an array of all commit message strings in the push event.
#  join(..., ' '): Flatten that array into a single space-separated string.
#  contains(..., '#skip'): Checks if #skip exists anywhere in that combined text.
#  !: Inversion. So, the step executes only when #skip is not found in any of the merged commits.
